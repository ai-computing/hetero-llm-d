apiVersion: v1
kind: ServiceAccount
metadata:
  name: k-exaone-236b-epp
  namespace: llm-serving
---
apiVersion: v1
data:
  default-plugins.yaml: "apiVersion: inference.networking.x-k8s.io/v1alpha1\nkind:\
    \ EndpointPickerConfig\nplugins:\n- type: queue-scorer\n- type: kv-cache-utilization-scorer\n\
    - type: prefix-cache-scorer\n- type: no-hit-lru-scorer\n- type: metrics-data-source\n\
    \  parameters:\n    scheme: http\n    path: /metrics\n    insecureSkipVerify:\
    \ true\n- type: core-metrics-extractor\nschedulingProfiles:\n- name: default\n\
    \  plugins:\n  - {pluginRef: queue-scorer, weight: 2}\n  - {pluginRef: kv-cache-utilization-scorer,\
    \ weight: 2}\n  - {pluginRef: prefix-cache-scorer, weight: 3}\n  - {pluginRef:\
    \ no-hit-lru-scorer, weight: 2}\n"
kind: ConfigMap
metadata:
  labels: {}
  name: k-exaone-236b-epp
  namespace: llm-serving
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: k-exaone-236b-epp
  name: k-exaone-236b-epp
  namespace: llm-serving
spec:
  paused: true
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: k-exaone-236b-epp
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: k-exaone-236b-epp
    spec:
      containers:
      - args:
        - --pool-name
        - k-exaone-236b-pool
        - --pool-namespace
        - llm-serving
        - --pool-group
        - inference.networking.k8s.io
        - --zap-encoder
        - json
        - --config-file
        - /config/default-plugins.yaml
        - --tracing=false
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        image: ghcr.io/llm-d/llm-d-router-endpoint-picker-dev:main
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          grpc:
            port: 9003
            service: inference-extension
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: epp
        ports:
        - containerPort: 9002
          name: grpc
          protocol: TCP
        - containerPort: 9003
          name: grpc-health
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          grpc:
            port: 9003
            service: inference-extension
          periodSeconds: 2
          successThreshold: 1
          timeoutSeconds: 1
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /config
          name: plugins-config-volume
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: llmd-router-epp
      serviceAccountName: k-exaone-236b-epp
      terminationGracePeriodSeconds: 130
      volumes:
      - configMap:
          defaultMode: 420
          items:
          - key: envoy.yaml
            path: envoy.yaml
          name: envoy
        name: config
      - configMap:
          defaultMode: 420
          name: k-exaone-236b-epp
        name: plugins-config-volume
  replicas: 1
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: k-exaone-236b-epp
  name: k-exaone-236b-epp
  namespace: llm-serving
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: grpc-ext-proc
    port: 9002
    protocol: TCP
    targetPort: 9002
  - name: http-metrics
    port: 9090
    protocol: TCP
    targetPort: 9090
  - name: http
    port: 8081
    protocol: TCP
    targetPort: 8081
  selector:
    app: k-exaone-236b-epp
  sessionAffinity: None
  type: ClusterIP
status:
  loadBalancer: {}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k-exaone-236b-epp-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: k-exaone-236b-epp
  namespace: llm-serving
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels: {}
  name: k-exaone-236b-epp-non-sa
  namespace: llm-serving
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llmd-router-epp-non-sa
subjects:
- kind: ServiceAccount
  name: k-exaone-236b-epp
  namespace: llm-serving
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels: {}
  name: k-exaone-236b-epp-sa
  namespace: llm-serving
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llmd-router-epp-sa
subjects:
- kind: ServiceAccount
  name: k-exaone-236b-epp
  namespace: llm-serving
