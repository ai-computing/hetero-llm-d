# EPP profile `precise-prefix` (opt-in): queue + KV load scoring plus PRECISE prefix-cache
# scoring from the engines' own KV-block events.
#
# Each endpoint publishes KV-block `stored` / `removed` events over ZMQ in the vLLM KV-events
# format; the EPP subscribes per pod (tcp://<pod-ip>:5557, topic prefix `kv@`), keeps a block
# index and scores an endpoint by how many of the request's blocks it actually holds.
#
# Requirements, all three:
#   1. Engines publish events. vLLM (A100 pool) does today:
#        --enable-prefix-caching
#        --kv-events-config '{"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"tcp://*:5557","topic":"kv@$(POD_IP)@<model>"}'
#      plus containerPort 5557 and env POD_IP (status.podIP). <model> = the served model name.
#      Optimus Prime PD stages will after aicomp#46. vllm-rbln and furiosa-llm are not verified
#      to publish them (keep `approx-prefix` there until checked).
#   2. Real token IDs in the EPP: the `estimate` tokenizer cannot match engine tokens. The
#      token-producer below calls a CPU-only `vllm launch render` sidecar added to the EPP pod by
#      manifests/epp/precise-prefix-render-sidecar.yaml (same model id as the pool).
#   3. The pool's pods are reachable from the EPP on 5557 (no NetworkPolicy in llm-serving today).
# An endpoint that publishes nothing just scores 0 on prefix; queue + KV still route it.
#
# Install (make-epp.sh substitutes the model and patches the sidecar in):
#   EPP_PROFILE=precise-prefix EPP_MODEL=meta-llama/Llama-3.1-8B-Instruct \
#     manifests/epp/make-epp.sh <pool> /<path>
apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig
plugins:
- type: token-producer
  parameters:
    modelName: meta-llama/Llama-3.1-8B-Instruct
    vllm:
      url: http://localhost:8200
- type: precise-prefix-cache-producer
  parameters:
    tokenProcessorConfig:
      blockSizeTokens: 64     # EPP-side hashing; need not match the engine's block size
    indexerConfig:
      kvBlockIndexConfig:
        enableMetrics: true
    kvEventsConfig:
      topicFilter: "kv@"
      concurrency: 4
      discoverPods: true
      podDiscoveryConfig:
        socketPort: 5557
- type: prefix-cache-scorer
  parameters:
    prefixMatchInfoProducerName: precise-prefix-cache-producer
- type: queue-scorer
- type: kv-cache-utilization-scorer
- type: endpoint-notification-source
- type: metrics-data-source
  parameters:
    scheme: http
    path: /metrics
    insecureSkipVerify: true
- type: core-metrics-extractor
  parameters:
    engineLabelKey: llm-d.ai/engine-type
    defaultEngine: vllm
    engineConfigs:
    - name: furiosa-llm
      queuedRequestsSpec: furiosa_llm_num_requests_waiting
      runningRequestsSpec: furiosa_llm_num_requests_running
      kvUsageSpec: furiosa_llm_kv_cache_usage_percent
      loraSpec: ""
      cacheInfoSpec: furiosa_llm_cache_config_info
dataLayer:
  sources:
  - pluginRef: metrics-data-source
    extractors:
    - pluginRef: core-metrics-extractor
  - pluginRef: endpoint-notification-source
    extractors:
    - pluginRef: precise-prefix-cache-producer
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: prefix-cache-scorer
    weight: 3
  - pluginRef: queue-scorer
    weight: 2
  - pluginRef: kv-cache-utilization-scorer
    weight: 2
