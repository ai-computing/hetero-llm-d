# ── 모델 스토어 디스커버리 ─────────────────────────────────────────────────────
# model-store PVC 를 RO 로 마운트해 주기적으로 스캔 → 인벤토리를 ConfigMap(model-inventory)으로 발행.
# lmd-top 이 이 ConfigMap 을 읽어 Deploy 뷰에 "배포 안 됐어도 존재하는 모델 + 컴파일 타깃 +
# 위치 + 그것을 만든 툴체인"을 표시.
# (PVC 를 파드 하나만 마운트하면 되므로 노드별 DaemonSet 불필요.)
#
# 적용:  kubectl apply -f manifests/model-store-discovery.yaml
# 확인:  kubectl -n llm-serving get cm model-inventory -o jsonpath='{.data.inventory}'
apiVersion: v1
kind: ServiceAccount
metadata: { name: model-discovery, namespace: llm-serving }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: model-discovery, namespace: llm-serving }
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: model-discovery, namespace: llm-serving }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: model-discovery }
subjects:
  - { kind: ServiceAccount, name: model-discovery, namespace: llm-serving }
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: model-discovery, namespace: llm-serving }
spec:
  schedule: "*/10 * * * *"          # 10분마다
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: model-discovery
          restartPolicy: Never
          # SMB 마운트가 확인된 노드에 고정(rag 의 nas 파드가 도는 노드). 환경에 맞게 조정.
          nodeSelector:
            kubernetes.io/hostname: cpu-1
          volumes:
            - name: store
              persistentVolumeClaim: { claimName: model-store, readOnly: true }
          containers:
            - name: scan
              image: bitnami/kubectl:latest    # bash + kubectl + find/du
              volumeMounts:
                - { name: store, mountPath: /mnt/store, readOnly: true }
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -eu
                  ROOT=/mnt/store; OUT=/tmp/inventory

                  # 산출물이 스스로 기록한 "무엇으로 빌드됐는지"를 읽는다.
                  #
                  # 이것이 왜 중요한가: 옵션이 완전히 같은 두 빌드가 서로 다르게 동작할 수
                  # 있고, 그 차이를 설명하는 유일한 사실이 컴파일러 버전이다. 실제로
                  # rebel-compiler 0.10.2 로 만든 산출물은 동작하고 0.10.3 은 같은 모델·같은
                  # 옵션으로 실패했는데, 그 답은 동작하는 산출물 안에만 적혀 있었다.
                  # (lmd-top/docs/RBLN-COMPILE-INCIDENT.md)
                  #
                  # 이 이미지에는 unzip·python3·strings 가 없으므로 tr+awk 로 읽는다.
                  built_with() {
                    d=$1; fmt=$2
                    case "$fmt" in
                      rbln)
                        # optimum-rbln 의 save_pretrained 가 남기는 평문 JSON.
                        v=$(grep -o '"optimum_rbln_version"[[:space:]]*:[[:space:]]*"[^"]*"' \
                              "$d/rbln_config.json" 2>/dev/null \
                            | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
                        [ -n "${v:-}" ] && echo "optimum-rbln=$v" || echo "-"
                        ;;
                      furiosa)
                        # model.fxb 는 zip 이고, 버전 매니페스트는 파일 끝쪽에 비압축으로
                        # 들어있다. 앞부분에는 없으므로 tail 로 읽는다 — 109MB 산출물에서
                        # 전체 읽기 5.9s 대 tail 0.14s.
                        v=$(tail -c 262144 "$d/model.fxb" 2>/dev/null \
                            | tr -c '[:print:]\n' '\n' \
                            | awk '/"furiosa_compiler"/{f=1}
                                   f && /"version"/{ if (match($0,/[0-9][0-9.]*/)) { print substr($0,RSTART,RLENGTH); exit } }')
                        [ -n "${v:-}" ] && echo "furiosa-compiler=$v" || echo "-"
                        ;;
                      *) echo "-" ;;
                    esac
                  }

                  # 포맷: repo | revision | format | compiled_for | size | path | built_with
                  # (built_with 는 뒤에 추가된 열 — 구버전 lmd-top 은 6열까지만 읽고 무시한다.)
                  echo "# repo | revision | format | compiled_for | size | path | built_with" > "$OUT"
                  # HF 캐시(원본 가중치) — 컴파일러가 관여하지 않으므로 출처 없음.
                  for d in "$ROOT"/hub/models--*/snapshots/*/ ; do
                    [ -d "$d" ] || continue
                    repo=$(basename "$(dirname "$(dirname "$d")")"); repo=${repo#models--}; repo=$(echo "$repo" | sed 's/--/\//')
                    rev=$(basename "$d"); sz=$(du -sh "$d" 2>/dev/null | cut -f1)
                    echo "$repo | $rev | hf | - | ${sz:-?} | ${d#$ROOT/} | -" >> "$OUT"
                  done
                  # NPU 컴파일 산출물(하드웨어·옵션별)
                  for d in "$ROOT"/compiled/*/rbln/*/ "$ROOT"/compiled/*/furiosa/*/ ; do
                    [ -d "$d" ] || continue
                    fmt=$(basename "$(dirname "$d")")
                    repo=$(basename "$(dirname "$(dirname "$d")")" | sed 's/--/\//')
                    tgt=$(basename "$d"); sz=$(du -sh "$d" 2>/dev/null | cut -f1)
                    bw=$(built_with "${d%/}" "$fmt")
                    echo "$repo | - | $fmt | $tgt | ${sz:-?} | ${d#$ROOT/} | $bw" >> "$OUT"
                  done
                  # 스토어 용량 — 이 파드만이 실제 마운트를 갖고 있으므로 여기서 재는 게 유일한 방법.
                  # (PVC 의 status.capacity 는 요청 용량이고, SMB 백엔드의 실제 여유와 다르다.)
                  # 형식: "<total_bytes> <used_bytes> <avail_bytes>" — 단위 해석은 읽는 쪽에서.
                  CAP=/tmp/capacity
                  if df -P -k "$ROOT" >/tmp/df.out 2>/dev/null; then
                    awk 'NR==2 { printf "%.0f %.0f %.0f\n", $2*1024, $3*1024, $4*1024 }' /tmp/df.out > "$CAP"
                  else
                    : > "$CAP"
                  fi
                  echo "[scan] $(( $(wc -l < "$OUT") - 1 )) entries · capacity $(cat "$CAP")"
                  kubectl create configmap model-inventory -n llm-serving \
                    --from-file=inventory="$OUT" --from-file=capacity="$CAP" \
                    --dry-run=client -o yaml | kubectl apply -f -
