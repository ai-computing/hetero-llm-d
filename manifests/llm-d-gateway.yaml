---
# Public Gateway exposed via Cilium → 사내망 NodePort로 노출
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: llm-d-gateway
  namespace: llm-serving
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
# All /v1/* OpenAI traffic → InferencePool (EPP가 KV-cache affinity 기반 picking)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openai-route
  namespace: llm-serving
spec:
  parentRefs:
    - name: llm-d-gateway
  rules:
    # Cilium GatewayClass는 InferencePool kind를 backendRef로 인식 못함 → Service 직결로 우회.
    # EPP 기반 KV-affinity 라우팅을 받으려면 standalone GAIE chart의 envoy(이미 띄움)나 별도 envoy를 backend로.
    - matches:
        - path: { type: PathPrefix, value: /exaone }
      filters:
        - type: URLRewrite
          urlRewrite:
            path: { type: ReplacePrefixMatch, replacePrefixMatch: /v1 }
      backendRefs:
        - name: vllm-rbln-llama31-8b
          port: 8000
    - matches:
        - path: { type: PathPrefix, value: /llama31 }
      filters:
        - type: URLRewrite
          urlRewrite:
            path: { type: ReplacePrefixMatch, replacePrefixMatch: /v1 }
      backendRefs:
        - name: furiosa-llama31-8b
          port: 8000
