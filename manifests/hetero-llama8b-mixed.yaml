# Heterogeneous mixed pool test (2026-10-19): one InferencePool, Llama-3.1-8B-Instruct on three vendors:
# NVIDIA A100 (vLLM v0.11.0, e11 via nodeName — e11 stays cordoned by decision) and on
# Furiosa RNGD (furiosa-llm 2026.3.0, FXB tag v2026.3), both served as
# meta-llama/Llama-3.1-8B-Instruct. The EPP maps each pod's metrics by its
# llm-d.ai/engine-type label. Gateway path: /hetero/llama8b/* -> /v1/*.
# Teardown: kubectl delete -f manifests/hetero-llama8b-mixed.yaml
# Plus RBLN ATOM (vllm-rbln 0.11 host stack) serving a Llama-3.x-8B artifact compiled with
# optimum-rbln 0.11.0.post1 (batch 8, max_seq_len 512 — requests must stay under 512 tokens),
# mounted read-only from the PD-disaggregation experiment directory. The older
# ~/vllm_test/rbln-Llama-3.1-8B-* artifacts (optimum-rbln 0.10.0.post1) are refused by the
# 0.11 runtime with LOADING_INVALID_VERSION.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hetero-l8b-a100
  namespace: llm-serving
  labels:
    experiment: hetero-l8b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hetero-l8b
      hetero-l8b/vendor: a100
  template:
    metadata:
      labels:
        app: hetero-l8b
        hetero-l8b/vendor: a100
        llm-d.ai/engine-type: vllm
    spec:
      containers:
      - args:
        - --model=meta-llama/Llama-3.1-8B-Instruct
        - --served-model-name=meta-llama/Llama-3.1-8B-Instruct
        - --tensor-parallel-size=1
        - --max-model-len=8192
        - --gpu-memory-utilization=0.90
        - --enable-prefix-caching
        - --enable-lora
        - --max-lora-rank=64
        - --max-loras=4
        - --host=0.0.0.0
        - --port=8000
        env:
        - name: HF_HOME
          value: /hf
        - name: HF_HUB_OFFLINE
          value: '1'
        - name: VLLM_ALLOW_RUNTIME_LORA_UPDATING
          value: 'True'
        image: docker.io/vllm/vllm-openai:v0.11.0
        imagePullPolicy: IfNotPresent
        name: vllm
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 60
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            nvidia.com/gpu: '1'
          requests:
            cpu: '4'
            memory: 32Gi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /hf
          name: hf
          readOnly: true
        - mountPath: /dev/shm
          name: shm
        - mountPath: /mnt/store
          name: store
          readOnly: true
      dnsPolicy: ClusterFirst
      nodeName: etri-esc8000-e11
      restartPolicy: Always
      runtimeClassName: nvidia
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - hostPath:
          path: /home/gspark/.cache/huggingface
          type: Directory
        name: hf
      - emptyDir:
          medium: Memory
          sizeLimit: 8Gi
        name: shm
      - name: store
        persistentVolumeClaim:
          claimName: model-store
          readOnly: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hetero-l8b-rbln
  namespace: llm-serving
  labels:
    experiment: hetero-l8b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hetero-l8b
      hetero-l8b/vendor: rbln
  template:
    metadata:
      labels:
        app: hetero-l8b
        hetero-l8b/vendor: rbln
        llm-d.ai/engine-type: vllm
    spec:
      containers:
      - args:
        - "set -eux\nexport DEBIAN_FRONTEND=noninteractive\napt-get update -qq\napt-get\
          \ install -y -qq --no-install-recommends \\\n  python3.10 python3.10-dev\
          \ python3-pip libdrm2 libnuma1 libgomp1 ca-certificates tzdata \\\n  g++\
          \ libc6-dev >/dev/null\nln -sf /usr/bin/python3.10 /usr/local/bin/python3\n\
          python3 -m pip install -q --target=/opt/py-overrides --upgrade prometheus-fastapi-instrumentator\n\
          export PYTHONPATH=\"/opt/py-overrides:${PYTHONPATH}\"\nexec python3 -m vllm.entrypoints.openai.api_server\
          \ \\\n  --model=/model \\\n  --served-model-name=meta-llama/Llama-3.1-8B-Instruct\
          \ \\\n  --enforce-eager \\\n  --max-num-seqs 8 \\\n  --max-model-len 512\
          \ \\\n  --block-size 512 \\\n  --host=0.0.0.0 --port=8000\n"
        command:
        - bash
        - -c
        env:
        - name: PYTHONPATH
          value: /home/gspark/.local/lib/python3.10/site-packages:/host-sys-local-pkgs:/host-sys-pkgs
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: VLLM_RBLN_NUM_DEVICES_PER_LOCAL_RANK
          value: '1'
        - name: LD_LIBRARY_PATH
          value: /host-rbln-lib:/host-libs
        - name: PATH
          value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/host-rbln-bin
        image: ubuntu:22.04
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 5
        name: server
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            rebellions.ai/ATOM: '1'
          requests:
            cpu: '8'
            memory: 48Gi
            rebellions.ai/ATOM: '1'
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /v1/models
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 5
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /home/gspark/.local/lib/python3.10/site-packages
          name: host-local-pkgs
          readOnly: true
        - mountPath: /host-sys-local-pkgs
          name: host-sys-local-pkgs
          readOnly: true
        - mountPath: /host-sys-pkgs
          name: host-sys-pkgs
          readOnly: true
        - mountPath: /host-libs
          name: host-libs
          readOnly: true
        - mountPath: /host-rbln-lib
          name: host-rbln-lib
          readOnly: true
        - mountPath: /host-rbln-bin
          name: host-rbln-bin
          readOnly: true
        - mountPath: /model
          name: model
          readOnly: true
        - mountPath: /dev/shm
          name: shm
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: etri-001
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - hostPath:
          path: /home/gspark/.local/lib/python3.10/site-packages
          type: Directory
        name: host-local-pkgs
      - hostPath:
          path: /usr/local/lib/python3.10/dist-packages
          type: Directory
        name: host-sys-local-pkgs
      - hostPath:
          path: /usr/lib/python3/dist-packages
          type: Directory
        name: host-sys-pkgs
      - hostPath:
          path: /usr/lib/x86_64-linux-gnu
          type: Directory
        name: host-libs
      - hostPath:
          path: /usr/lib
          type: Directory
        name: host-rbln-lib
      - hostPath:
          path: /usr/bin
          type: Directory
        name: host-rbln-bin
      - hostPath:
          path: /home/gspark/workspace/01_pd_disag/experiments/native_pd_2026_4/native_atom_b8_20261016/r1/compiled
          type: Directory
        name: model
      - emptyDir:
          medium: Memory
          sizeLimit: 16Gi
        name: shm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hetero-l8b-rngd
  namespace: llm-serving
  labels:
    experiment: hetero-l8b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hetero-l8b
      hetero-l8b/vendor: rngd
  template:
    metadata:
      labels:
        app: hetero-l8b
        hetero-l8b/vendor: rngd
        llm-d.ai/engine-type: furiosa-llm
    spec:
      nodeSelector:
        kubernetes.io/hostname: etri-001
      volumes:
      - name: cache
        emptyDir: {}
      containers:
      - name: server
        image: furiosaai/furiosa-llm:2026.3.0
        args:
        - serve
        - furiosa-ai/Llama-3.1-8B-Instruct
        - --revision
        - v2026.3
        - --served-model-name
        - meta-llama/Llama-3.1-8B-Instruct
        - --port
        - '8000'
        - --tensor-parallel-size
        - '8'
        ports:
        - containerPort: 8000
        env:
        - name: HF_HOME
          value: /model-cache
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          failureThreshold: 180
        resources:
          limits:
            furiosa.ai/rngd: '1'
          requests:
            cpu: '4'
            memory: 32Gi
            furiosa.ai/rngd: '1'
        volumeMounts:
        - name: cache
          mountPath: /model-cache
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hetero-l8b-epp
  namespace: llm-serving
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hetero-l8b-epp-sa
  namespace: llm-serving
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llmd-router-epp-sa
subjects:
- kind: ServiceAccount
  name: hetero-l8b-epp
  namespace: llm-serving
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hetero-l8b-epp-non-sa
  namespace: llm-serving
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llmd-router-epp-non-sa
subjects:
- kind: ServiceAccount
  name: hetero-l8b-epp
  namespace: llm-serving
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hetero-l8b-epp-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: hetero-l8b-epp
  namespace: llm-serving
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hetero-l8b-epp
  namespace: llm-serving
data:
  default-plugins.yaml: "apiVersion: llm-d.ai/v1alpha1\nkind: EndpointPickerConfig\n\
    plugins:\n- type: queue-scorer\n- type: kv-cache-utilization-scorer\n- type: prefix-cache-scorer\n\
    - type: metrics-data-source\n  parameters:\n    scheme: http\n    path: /metrics\n\
    \    insecureSkipVerify: true\n- type: core-metrics-extractor\n  parameters:\n\
    \    # Pods declare their engine with llm-d.ai/engine-type; RBLN runs vLLM (built-in\
    \ mapping),\n    # RNGD runs furiosa-llm, whose metrics are mapped here.\n   \
    \ engineLabelKey: llm-d.ai/engine-type\n    defaultEngine: vllm\n    engineConfigs:\n\
    \    - name: furiosa-llm\n      queuedRequestsSpec: furiosa_llm_num_requests_waiting\n\
    \      runningRequestsSpec: furiosa_llm_num_requests_running\n      kvUsageSpec:\
    \ furiosa_llm_kv_cache_usage_percent\n      loraSpec: ''\n      cacheInfoSpec:\
    \ furiosa_llm_cache_config_info\nschedulingProfiles:\n- name: default\n  plugins:\n\
    \  - pluginRef: queue-scorer\n    weight: 2\n  - pluginRef: kv-cache-utilization-scorer\n\
    \    weight: 2\n  - pluginRef: prefix-cache-scorer\n    weight: 3\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hetero-l8b-epp
  namespace: llm-serving
  labels:
    experiment: hetero-l8b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hetero-l8b-epp
  template:
    metadata:
      labels:
        app: hetero-l8b-epp
    spec:
      serviceAccountName: hetero-l8b-epp
      containers:
      - name: epp
        image: ghcr.io/llm-d/llm-d-router-endpoint-picker-dev@sha256:c0d60804102f84ed751a86200de380b90cd1dad271054b6e33fa6ab6683ac93d
        args:
        - --pool-name
        - hetero-l8b-pool
        - --pool-namespace
        - llm-serving
        - --pool-group
        - inference.networking.k8s.io
        - --config-file
        - /config/default-plugins.yaml
        - --zap-encoder
        - json
        - --tracing=false
        - --v=3
        ports:
        - name: grpc
          containerPort: 9002
        - name: grpc-health
          containerPort: 9003
        - name: metrics
          containerPort: 9090
        readinessProbe:
          grpc:
            port: 9003
            service: inference-extension
          periodSeconds: 2
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: plugins
          mountPath: /config
      volumes:
      - name: plugins
        configMap:
          name: hetero-l8b-epp
---
apiVersion: v1
kind: Service
metadata:
  name: hetero-l8b-epp
  namespace: llm-serving
spec:
  selector:
    app: hetero-l8b-epp
  ports:
  - name: grpc-ext-proc
    port: 9002
    targetPort: 9002
  - name: http-metrics
    port: 9090
    targetPort: 9090
---
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: hetero-l8b-pool
  namespace: llm-serving
spec:
  selector:
    matchLabels:
      app: hetero-l8b
  targetPorts:
  - number: 8000
  endpointPickerRef:
    name: hetero-l8b-epp
    port:
      number: 9002
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hetero-l8b-route
  namespace: llm-serving
spec:
  parentRefs:
  - name: llm-d-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /hetero/llama8b
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /v1
    backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: hetero-l8b-pool
    timeouts:
      request: 300s
