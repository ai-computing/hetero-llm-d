---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-exaone
  namespace: llm-serving
  labels: { app: vllm-exaone, llm-d.ai/accelerator: gpu-nvidia, llm-d.ai/role: chat, llm-d.ai/engine: vllm }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: vllm-exaone } }
  template:
    metadata:
      labels: { app: vllm-exaone, llm-d.ai/accelerator: gpu-nvidia, llm-d.ai/role: chat, llm-d.ai/engine: vllm }
    spec:
      runtimeClassName: nvidia
      nodeSelector: { kubernetes.io/hostname: etri-001 }
      initContainers:
      - name: download
        image: python:3.11-slim
        command: ["bash","-c"]
        args:
        - |
          set -eux
          if [[ -f /models/exaone35/config.json ]] && [[ -n "$(ls /models/exaone35/*.safetensors 2>/dev/null | head -1)" ]]; then
            echo "model already present"; ls -lh /models/exaone35/ | head; exit 0
          fi
          pip install --quiet 'huggingface_hub[hf_transfer]==0.36.0'
          export HF_HUB_ENABLE_HF_TRANSFER=1
          mkdir -p /models/exaone35
          hf download LGAI-EXAONE/EXAONE-3.5-32B-Instruct-AWQ --local-dir /models/exaone35
          ls -lh /models/exaone35/ | head
        env:
        - { name: HF_TOKEN, valueFrom: { secretKeyRef: { name: hf-token, key: HF_TOKEN } } }
        - { name: HF_HUB_ENABLE_HF_TRANSFER, value: "1" }
        volumeMounts:
        - { name: models, mountPath: /models }
      containers:
      - name: vllm
        image: docker.io/vllm/vllm-openai:v0.9.2
        # EXAONE 3.5는 stable v0.9.2에서 검증됨 (56k 다운로드)
        args:
        - --model=/models/exaone35
        - --served-model-name=exaone-3.5-32b
        - --tensor-parallel-size=1
        - --max-model-len=32768
        - --gpu-memory-utilization=0.85
        - --kv-cache-dtype=auto
        - --trust-remote-code
        - --enable-prefix-caching
        - --enable-chunked-prefill
        - --max-num-seqs=32
        - --host=0.0.0.0
        - --port=8000
        env:
        - { name: HF_TOKEN, valueFrom: { secretKeyRef: { name: hf-token, key: HF_TOKEN } } }
        - { name: PYTHONUNBUFFERED, value: "1" }
        ports: [{ containerPort: 8000, name: http }]
        resources:
          limits: { nvidia.com/gpu: 1 }
          requests: { nvidia.com/gpu: 1, cpu: "8", memory: 48Gi }
        readinessProbe:
          httpGet: { path: /health, port: 8000 }
          initialDelaySeconds: 120
          periodSeconds: 15
          failureThreshold: 60
        volumeMounts:
        - { name: models, mountPath: /models, readOnly: true }
        - { name: shm, mountPath: /dev/shm }
      volumes:
      - name: models
        hostPath: { path: /home/gspark/vllm-exaone35-models, type: DirectoryOrCreate }
      - name: shm
        emptyDir: { medium: Memory, sizeLimit: 16Gi }
---
apiVersion: v1
kind: Service
metadata: { name: vllm-exaone, namespace: llm-serving, labels: { app: vllm-exaone } }
spec:
  type: NodePort
  selector: { app: vllm-exaone }
  ports: [{ name: http, port: 8000, targetPort: 8000, nodePort: 30806 }]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm-exaone
  namespace: monitoring
  labels: { release: kube-prometheus-stack }
spec:
  namespaceSelector: { matchNames: [llm-serving] }
  selector: { matchLabels: { app: vllm-exaone } }
  endpoints: [{ port: http, path: /metrics, interval: 15s }]
