# Install: helm ... -f <(scripts/render-manifest.sh manifests/furiosa-llm-modelservice-values.yaml)   (LLMD_* values: cluster.local.env)
modelArtifacts:
  name: "furiosa-ai/Llama-3.1-8B-Instruct"
  uri: "hf://furiosa-ai/Llama-3.1-8B-Instruct"
  size: 30Gi
  labels:
    llm-d.ai/inferenceServing: "true"
    llm-d.ai/model: llama-3.1-8b-instruct-furiosa

accelerator:
  type: furiosa
  resources:
    furiosa: "furiosa.ai/rngd"

dra:
  enabled: false

decode:
  create: true
  replicas: 1
  parallelism:
    tensor: 4
    data: 1
    pipeline: 1
  nodeSelector:
    kubernetes.io/hostname: ${LLMD_NODE_NPU2}
  containers:
    - name: "furiosa-llm"
      image: "furiosaai/furiosa-llm:2026.3.0"   # pinned: 2026.4 drops --tensor-parallel-size
      modelCommand: furiosaLLMServe
      mountModelVolume: true
      resources:
        limits:
          furiosa.ai/rngd: 4
        requests:
          furiosa.ai/rngd: 4
          cpu: "8"
          memory: 32Gi
