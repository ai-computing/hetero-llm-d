# ── 공유 모델 스토어 (RWX PVC on SMB/NAS) ─────────────────────────────────────
# 목적: HF 가중치 + NPU(RBLN/Furiosa) 컴파일 산출물을 노드 간 "한 번 받고/컴파일하고, 어디서나 서빙".
#       hostPath(노드마다 중복) → 공유 PVC 로 전환. lmd-top Deploy 뷰의 단일 진실원천.
#
# 백엔드: 이 클러스터에 이미 있는 SMB CSI(smb.csi.k8s.io, //192.0.2.14/lab, secret rag/smb-creds)를
#         그대로 사용(nas-lab PV 와 동일 패턴). SMB 는 RWX 지원.
# 전제:  rag/smb-creds 로 해당 share 에 **쓰기 권한**이 있어야 함(nas-lab 은 ro 였음).
#         쓰기 share 가 따로면 volumeAttributes.source 를 그 share 로 바꿀 것.
#
# 권장 레이아웃(share 안, 소비자는 subPath 로 마운트):
#   llm-model-store/hub/models--{org}--{name}/snapshots/{rev}/       # HF 원본(공유 캐시)
#   llm-model-store/compiled/{org}--{name}/rbln/{npu}-tp{n}-s{len}/  # RBLN 컴파일본(하드웨어·옵션별)
#   llm-model-store/compiled/{org}--{name}/furiosa/{opts-hash}/      # Furiosa 컴파일본
#
# 적용:  kubectl apply -f manifests/model-store.yaml
# 확인:  kubectl -n llm-serving get pvc model-store   # STATUS=Bound
apiVersion: v1
kind: PersistentVolume
metadata:
  name: llm-model-store
  labels: { app.kubernetes.io/part-of: llm-d, role: model-store }
spec:
  capacity:
    storage: 1Ti                 # SMB 에선 강제되지 않음(표시용)
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - vers=3.1.1        # error(115) 회피 — 최신 SMB 다이얼렉트(3.0 실패 시)
    - nosharesock
    - noserverino
    - file_mode=0664
    - dir_mode=0775
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: llm-model-store
    volumeAttributes:
      source: //192.0.2.14/lab      # 쓰기 가능한 share 로. (전용 share 있으면 //.../models 등)
    nodeStageSecretRef:
      name: smb-creds
      namespace: rag
  claimRef:
    name: model-store
    namespace: llm-serving
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-store
  namespace: llm-serving
  labels: { app.kubernetes.io/part-of: llm-d, role: model-store }
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""           # static 바인딩(동적 프로비저닝 아님)
  volumeName: llm-model-store
  resources:
    requests:
      storage: 1Ti
