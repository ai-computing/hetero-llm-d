---
apiVersion: v1
kind: Service
metadata:
  name: furiosa-llama31-8b
  namespace: llm-serving
  labels:
    llm-d.ai/inferenceServing: "true"
    llm-d.ai/model: llama-3.1-8b-instruct-furiosa
spec:
  type: NodePort
  selector:
    llm-d.ai/inferenceServing: "true"
    llm-d.ai/model: llama-3.1-8b-instruct-furiosa
    llm-d.ai/role: decode
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30801
---
# Furiosa Llama 전용 InferencePool — Rebellions(EXAONE)와 분리
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: furiosa-llama31-8b-pool
  namespace: llm-serving
spec:
  appProtocol: http
  selector:
    matchLabels:
      llm-d.ai/inferenceServing: "true"
      llm-d.ai/model: llama-3.1-8b-instruct-furiosa
      llm-d.ai/role: decode
  targetPorts:
    - number: 8000
  endpointPickerRef:
    group: ""
    kind: Service
    name: llmd-router-epp        # EPP 재사용
    port:
      number: 9002
    failureMode: FailClose
