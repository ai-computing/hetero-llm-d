name: hetero-llm-d
protocol: "0.1"
layer: l4-cluster
kind: cluster
summary: 이기종(A100·RBLN ATOM·Furiosa RNGD·CPU) K8s 클러스터를 llm-d(Gateway→InferencePool→EPP)로 묶는 매니페스트·셋업 스크립트·모델 스토어·모니터링 구성
maturity: prototype
hardware: [A100, ATOM, RNGD, GB10, CPU]
install: []                   # 클러스터 부트스트랩은 root 권한 수동 단계(scripts/01~05), README「실행 순서」
test:
  - python3 scripts/test-model-store-discovery.py
  - python3 scripts/test-airm-placement.py      # placement hook + EPP config checker
  - python3 scripts/check-epp-config.py         # EPP profiles vs pinned llm-d-router plugin set
  - bash -n scripts/*.sh manifests/epp/make-epp.sh
  - scripts/airm-install.sh dry-run   # 서버 dry-run (클러스터 접근 필요)
deploy:
  target: llm-d
  manifests: deploy/airm       # ai-rm 수집 설정·airm-placement. CRD는 rm-core v0.1.1에서 scripts/airm-install.sh가 받는다
  values: deploy/helm/cluster-values.yaml   # umbrella chart 클러스터 공통 값 (키·기본값만)
  image: null                 # scripts/04-build-vllm-rbln.sh가 노드 로컬 이미지 vllm-rbln:0.10.2를 만들지만 레지스트리 배포는 없음
config:
  env_example: cluster.example.env
interfaces:
  provides: [Placement, Metrics]
  uses: [Accelerator, Workload]
metrics: []                   # 이 레포는 airm_* 지표를 직접 내지 않고 수집만 한다 (deploy/airm/scrape-airm.yaml)
kpi: [이종자원수, 전력효율, SLO]
